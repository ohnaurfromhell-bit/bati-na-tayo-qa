
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bati na tayo Q&A</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #51415f;
      background: linear-gradient(135deg, #f6eaff, #ffe8f1);
    }

    .container {
      max-width: 520px;
      margin: 20px auto;
      padding: 28px 22px;
      background: rgba(255,255,255,0.88);
      border: 2px solid #ead7f5;
      border-radius: 25px;
      box-shadow: 0 8px 25px #b99bc533;
      text-align: center;
    }

    .cat {
      width: 130px;
      height: 110px;
      margin: 0 auto 12px;
    }

    h1 {
      color: #9b72b8;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #a47e9c;
      margin-bottom: 25px;
    }

    .question {
      padding: 16px;
      margin: 13px 0;
      background: #f7efff;
      border: 1px solid #eadcf8;
      border-radius: 15px;
      text-align: left;
      font-weight: bold;
    }

    .question span {
      display: block;
      margin-bottom: 5px;
      color: #b07eaa;
      font-size: 13px;
    }

    input, textarea {
      display: block;
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border: 1px solid #dfc8ed;
      border-radius: 12px;
      font: inherit;
      background: #fffaff;
      color: #51415f;
    }

    textarea {
      min-height: 65px;
      resize: vertical;
    }

    button {
      padding: 13px 20px;
      border: none;
      border-radius: 20px;
      background: #bd91d5;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin: 8px 4px;
    }

    button:hover { background: #a979c5; }

    .secondary {
      background: #e6b5ce;
      color: #67465d;
    }

    .hidden { display: none; }

    #message {
      min-height: 22px;
      font-size: 14px;
      color: #8a5c94;
      overflow-wrap: anywhere;
    }

    .admin-area {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 2px dashed #ead7f5;
    }

    .small {
      font-size: 12px;
      color: #987f9c;
    }
  </style>
</head>

<body>
  <main class="container">

    <svg class="cat" viewBox="0 0 150 125"
         xmlns="http://www.w3.org/2000/svg" aria-label="Black and white cat">
      <path d="M25 48 L30 7 L62 32 Q75 25 88 32 L120 7 L125 48
               Q137 64 130 91 Q120 120 75 120 Q30 120 20 91 Q13 64 25 48Z"
            fill="white" stroke="#444" stroke-width="4"/>
      <path d="M30 12 L34 47 Q45 31 62 32Z" fill="#333"/>
      <path d="M120 12 L116 47 Q105 31 88 32Z" fill="#333"/>
      <path d="M48 47 Q60 39 70 49 L65 73 Q50 79 43 65Z" fill="#333"/>
      <path d="M102 47 Q90 39 80 49 L85 73 Q100 79 107 65Z" fill="#333"/>
      <ellipse cx="54" cy="70" rx="5" ry="7" fill="#333"/>
      <ellipse cx="96" cy="70" rx="5" ry="7" fill="#333"/>
      <path d="M70 83 Q75 78 80 83 Q75 91 70 83Z" fill="#e99ab9"/>
      <path d="M75 89 Q68 100 60 94 M75 89 Q82 100 90 94"
            fill="none" stroke="#444" stroke-width="2" stroke-linecap="round"/>
      <path d="M43 85 L12 80 M43 94 L12 98 M107 85 L138 80 M107 94 L138 98"
            stroke="#777" stroke-width="2" stroke-linecap="round"/>
    </svg>

    <h1>Bati na tayo Q&A ♡</h1>
    <p class="subtitle">Bati na kasi!</p>

    <section id="questions">
      <div class="question">
        <span>QUESTION 1</span>
        Baby, bati na tayo?
      </div>

      <div class="question">
        <span>QUESTION 2</span>
        Mahal ko, bati na please?
      </div>

      <div class="question">
        <span>QUESTION 3</span>
        Baby naman kasi. Bati naman na oh?
      </div>
    </section>

    <button id="loginButton" class="secondary" type="button">
      Admin login
    </button>

    <section id="loginArea" class="hidden">
      <h2>Admin Login ♡</h2>
      <form id="loginForm">
        <input id="email" type="email" placeholder="Admin email" required>
        <input id="password" type="password" placeholder="Password" required>
        <button type="submit">Log in</button>
      </form>
    </section>

    <section id="adminArea" class="admin-area hidden">
      <h2>My Private Answers ♡</h2>
      <p class="small">Only your administrator account can access these.</p>

      <form id="answersForm">
        <label for="answer1">1. Favorite color</label>
        <textarea id="answer1" placeholder="Write your answer..."></textarea>

        <label for="answer2">2. Favorite food</label>
        <textarea id="answer2" placeholder="Write your answer..."></textarea>

        <label for="answer3">3. Best friend</label>
        <textarea id="answer3" placeholder="Write your answer..."></textarea>

        <button type="submit">Save all answers</button>
        <button id="logoutButton" class="secondary" type="button">
          Log out
        </button>
      </form>
    </section>

    <p id="message" role="status"></p>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <script>
    // STEP 14: Replace these values with your Firebase config.
    const firebaseConfig = {
      apiKey: "AIzaSyBDZ604GWEtKoyfwiaeofp_2kcwIirmI8w",
      authDomain: "bati-na-tayo-qa.firebaseapp.com",
      projectId: "bati-na-tayo-qa",
      storageBucket: "bati-na-tayo-qa.firebasestorage.app",
      messagingSenderId: "859737941196",
      appId: "1:859737941196:web:710237c76744a51a518e69"
    };

    // STEP 14: Replace this with your Firebase Admin UID.
    const ADMIN_UID = "DiEIEuP2pKbeA89xFGPlOFc4jn22";

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();
    const answerDoc = db.collection("privateAnswers").doc("main");

    const loginButton = document.getElementById("loginButton");
    const loginArea = document.getElementById("loginArea");
    const adminArea = document.getElementById("adminArea");
    const message = document.getElementById("message");

    loginButton.addEventListener("click", () => {
      loginArea.classList.toggle("hidden");
      message.textContent = "";
    });

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "Logging in...";

      try {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const result = await auth.signInWithEmailAndPassword(email, password);

        if (result.user.uid !== ADMIN_UID) {
          await auth.signOut();
          message.textContent = "You are not authorized to view answers.";
          return;
        }

        message.textContent = "Welcome, admin!";
      } catch (error) {
        message.textContent = "Login failed. Please check your email and password.";
      }
    });

    auth.onAuthStateChanged(async (user) => {
      if (user && user.uid === ADMIN_UID) {
        loginButton.classList.add("hidden");
        loginArea.classList.add("hidden");
        adminArea.classList.remove("hidden");

        try {
          const snapshot = await answerDoc.get();

          if (snapshot.exists) {
            const data = snapshot.data();
            document.getElementById("answer1").value = data.answer1 || "";
            document.getElementById("answer2").value = data.answer2 || "";
            document.getElementById("answer3").value = data.answer3 || "";
          }

          message.textContent = "Your private answers are ready.";
        } catch (error) {
          message.textContent = "Could not load answers. Check your database rules.";
        }
      } else {
        loginButton.classList.remove("hidden");
        adminArea.classList.add("hidden");
      }
    });

    document.getElementById("answersForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const user = auth.currentUser;

      if (!user || user.uid !== ADMIN_UID) {
        message.textContent = "You are not authorized.";
        return;
      }

      const answers = {
        answer1: document.getElementById("answer1").value,
        answer2: document.getElementById("answer2").value,
        answer3: document.getElementById("answer3").value
      };

      try {
        await answerDoc.set(answers);
        message.textContent = "Your answers have been saved! ♡";
      } catch (error) {
        message.textContent = "Could not save answers. Please check your connection and rules.";
      }
    });

    document.getElementById("logoutButton").addEventListener("click", async () => {
      await auth.signOut();
      message.textContent = "You have logged out.";
    });
  </script>
</body>
</html>
